name: Build and Deploy to EC2

on:
  push:
    branches: ["main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: nxcreations/nxc-portfolio:latest
          build-args: |
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            CONTACT_TO_EMAIL=${{ secrets.CONTACT_TO_EMAIL }}
            CONTACT_FROM_EMAIL=${{ secrets.CONTACT_FROM_EMAIL }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull nxcreations/nxc-portfolio:latest
            docker stop nxc-portfolio || true
            docker rm nxc-portfolio || true
            docker run -d --name nxc-portfolio --restart always \
              -p 9990:3000 \
              -e RESEND_API_KEY="${{ secrets.RESEND_API_KEY }}" \
              -e CONTACT_TO_EMAIL="${{ secrets.CONTACT_TO_EMAIL }}" \
              -e CONTACT_FROM_EMAIL="${{ secrets.CONTACT_FROM_EMAIL }}" \
              nxcreations/nxc-portfolio:latest
