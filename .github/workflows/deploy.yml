name: Build and Deploy to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # ⚠️ อย่าลืมเปลี่ยน YOUR_DOCKER_USERNAME เป็นชื่อบัญชี Docker Hub ของคุณ
          tags: YOUR_DOCKER_USERNAME/nxc-portfolio:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull YOUR_DOCKER_USERNAME/nxc-portfolio:latest
            docker stop nxc-portfolio || true
            docker rm nxc-portfolio || true
            docker run -d --name nxc-portfolio --restart always -p 8080:3000 YOUR_DOCKER_USERNAME/nxc-portfolio:latest